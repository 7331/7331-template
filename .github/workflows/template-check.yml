name: template-check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  generated-app-gates:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - option_set: all-on
            include_accounts: "true"
            include_redis: "true"
          - option_set: all-off
            include_accounts: "false"
            include_redis: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      - name: Generate the app
        env:
          INCLUDE_ACCOUNTS: ${{ matrix.include_accounts }}
          INCLUDE_REDIS: ${{ matrix.include_redis }}
          OPTION_SET: ${{ matrix.option_set }}
        run: |
          git config --global user.name template-check
          git config --global user.email template-check@example.invalid
          git config --global init.defaultBranch main
          uvx copier copy --trust --defaults --vcs-ref HEAD \
            --data project_slug=sample-app \
            --data "include_accounts=${INCLUDE_ACCOUNTS}" \
            --data "include_redis=${INCLUDE_REDIS}" \
            . "${RUNNER_TEMP}/${OPTION_SET}"
          git -C "${RUNNER_TEMP}/${OPTION_SET}" add --all
          git -C "${RUNNER_TEMP}/${OPTION_SET}" commit --quiet --message "Generated app"
      - name: Run every gate on the generated app
        env:
          OPTION_SET: ${{ matrix.option_set }}
        working-directory: ${{ runner.temp }}
        run: |
          cd "${OPTION_SET}"
          uvx prek run --all-files

  workflow-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      - name: Audit workflows and Dependabot config
        env:
          GH_TOKEN: ${{ github.token }}
        run: uvx zizmor==1.32.0 .github
